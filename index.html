 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zina Ewing</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:black;
color:white;
font-family:Arial, Helvetica, sans-serif;
overflow-x:hidden;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
padding:40px;
background:
radial-gradient(circle at top left, rgba(140,0,255,.35), transparent 30%),
radial-gradient(circle at bottom right, rgba(0,255,170,.18), transparent 30%),
black;
}

.status{
font-size:12px;
letter-spacing:2px;
text-transform:uppercase;
color:#98ffd7;
margin-bottom:20px;
}

h1{
font-size:clamp(70px,14vw,180px);
line-height:.85;
letter-spacing:-7px;
text-transform:uppercase;
font-weight:900;
}

.subtitle{
margin-top:25px;
max-width:500px;
color:#999;
font-size:18px;
line-height:1.5;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
padding:20px;
}

.card{
position:relative;
overflow:hidden;
border-radius:20px;
background:#111;
min-height:300px;
}

.card img{
width:100%;
height:100%;
object-fit:cover;
transition:.5s;
filter:contrast(1.1) saturate(1.1);
}

.card:hover img{
transform:scale(1.05);
filter:contrast(1.3) saturate(1.4);
}

.label{
position:absolute;
top:15px;
left:15px;
background:rgba(0,0,0,.7);
padding:8px 12px;
border-radius:999px;
font-size:11px;
text-transform:uppercase;
letter-spacing:1px;
}

.contact{
padding:120px 30px;
}

.contact h2{
font-size:clamp(50px,10vw,120px);
line-height:.9;
margin-bottom:20px;
}

.contact p{
color:#888;
margin-bottom:30px;
}

.links{
display:flex;
gap:15px;
flex-wrap:wrap;
}

.links a{
padding:14px 22px;
border:1px solid white;
border-radius:999px;
color:white;
text-decoration:none;
transition:.3s;
}

.links a:hover{
background:white;
color:black;
}

footer{
padding:30px;
color:#666;
font-size:14px;
}

@media(max-width:700px){

.grid{
grid-template-columns:1fr;
}

h1{
letter-spacing:-4px;
}

}

</style>
</head>

<body>

<section class="hero">
<div class="status">● available for freelance</div>

<h1>
ZINA<br>
EWING
</h1>

<p class="subtitle">
digital artist / illustration / cyber grunge visuals / tattoo sketches / emotional imagery
</p>
</section>

<section class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1200&auto=format&fit=crop">
<div class="label">portrait</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1200&auto=format&fit=crop">
<div class="label">visual</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?q=80&w=1200&auto=format&fit=crop">
<div class="label">concept</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1200&auto=format&fit=crop">
<div class="label">design</div>
</div>

</section>

<section class="contact">

<h2>LET’S<br>WORK</h2>

<p>
commissions / collaborations / creative projects
</p>

<div class="links">
<a href="https://instagram.com/">instagram</a>
<a href="https://t.me/">telegram</a>
</div>

</section>

<footer>
© Zina Ewing
</footer>

</body>
</html>
